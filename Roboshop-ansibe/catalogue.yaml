- name: Catalouge configuration
  hosts: Ansiweb
  become: yes
  tasks:
   - name: enable nodejs
     ansible.builtin.command: dnf module enable nodejs:20 -y 

   - name: Install nodejs
     ansible.builtin.dnf:
      name: nodejs
      state: present

   - name: createing user
     ansible.builtin.user:
      name: roboshop
      system: true
      home: /app
      shell: /sbin/nologin
      comment: "roboshop user"

   - name: delete app directory
     ansible.builtin.file:
       path: /app
       state: absent 

   - name: create directory
     ansible.builtin.file:
      path: /app
      state: directory

   - name: download the application
     ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip 
      dest: /tmp/catalogue.zip

   - name: unzip the code
     ansible.builtin.unarchive:
      src: /tmp/catalogue.zip
      dest: /app   
      remote_src: yes

   - name: install dependencies
     community.general.npm:
      path: /app   
   
   - name: copy the service
     ansible.builtin.copy:
      src: catalogue.service
      dest: /etc/systemd/system/catalogue.service

   - name: copy mongo repo
     ansible.builtin.copy:
      src: mongo.repo   
      dest: /etc/yum.repos.d/mongo.repo

   - name: install mondo client
     ansible.builtin.dnf:
      name: mongodb-mongosh
      state: present

   - name: load the products
     ansible.builtin.shell: mongosh --host "{{ MONGODB_HOST }}" </app/db/master-data.js
     when: catalogue_output.stdout  | int < 0

   - name: start catalogue
     ansible.builtin.service:
      name: catalogue
      state: restarted
      enabled: yes  
